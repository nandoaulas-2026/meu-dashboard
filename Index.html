<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Financeiro Interativo - Nando</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background-color: #121214; color: #e1e1e6; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 { margin-bottom: 20px; font-size: 24px; color: #fff; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .card { background-color: #202024; border-radius: 8px; padding: 20px; border: 1px solid #29292e; }
    .card h3 { font-size: 14px; color: #a8a8b3; margin-bottom: 10px; text-transform: uppercase; }
    .card .value { font-size: 24px; font-weight: bold; }
    
    .green { color: #00b37e; }
    .red { color: #f75a68; }
    .yellow { color: #fba94c; }
    
    .section-title { font-size: 18px; margin: 25px 0 15px 0; color: #e1e1e6; border-bottom: 1px solid #29292e; padding-bottom: 8px; }
    
    form { background: #202024; padding: 15px; border-radius: 8px; border: 1px solid #29292e; display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
    form input, form select, form button { padding: 10px; border-radius: 6px; border: 1px solid #29292e; background: #121214; color: #fff; font-size: 14px; }
    form input[type="text"] { flex: 2; min-width: 150px; }
    form input[type="number"], form input[type="date"] { flex: 1; min-width: 100px; }
    form select { flex: 1; min-width: 120px; }
    form button { background: #00b37e; color: #fff; font-weight: bold; border: none; cursor: pointer; flex: 1; min-width: 120px; }
    form button:hover { background: #00875f; }

    table { width: 100%; border-collapse: collapse; background: #202024; border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
    th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #29292e; font-size: 14px; }
    th { background-color: #29292e; color: #a8a8b3; }
    
    .btn-del { background: transparent; border: none; color: #f75a68; cursor: pointer; font-weight: bold; }
    .btn-del:hover { color: #ff0000; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📱 Dashboard Financeiro App - Nando</h1>
    
    <!-- CARDS DE TOTAL -->
    <div class="grid">
      <div class="card">
        <h3>Receita Realizada</h3>
        <div class="value green" id="total-receita">R$ 1.728,00</div>
      </div>
      <div class="card">
        <h3>Despesas Realizadas</h3>
        <div class="value red" id="total-despesas">R$ 884,79</div>
      </div>
      <div class="card">
        <h3>Saldo Atual</h3>
        <div class="value green" id="saldo-total">+ R$ 843,21</div>
      </div>
    </div>

    <!-- FORMULÁRIO DE NOVO LANÇAMENTO -->
    <div class="section-title">➕ Novo Lançamento Rápido</div>
    <form id="finance-form">
      <input type="date" id="date" required>
      <input type="text" id="description" placeholder="Descrição (ex: Mercado, Aluno X)" required>
      <input type="number" step="0.01" id="amount" placeholder="Valor (R$)" required>
      <select id="type">
        <option value="expense">Saída (Gasto)</option>
        <option value="income">Entrada (Receita)</option>
      </select>
      <select id="category">
        <option value="Mercado">Mercado</option>
        <option value="Panificadora">Panificadora</option>
        <option value="Transporte">Transporte</option>
        <option value="Restaurante">Restaurante</option>
        <option value="Aulas">Aulas/Alunos</option>
        <option value="Outros">Outros</option>
      </select>
      <button type="submit">Lançar</button>
    </form>

    <!-- TABELA INTERATIVA -->
    <div class="section-title">📝 Extrato de Transações Registradas</div>
    <table>
      <thead>
        <tr>
          <th>Data</th>
          <th>Descrição</th>
          <th>Categoria</th>
          <th>Valor</th>
          <th>Ação</th>
        </tr>
      </thead>
      <tbody id="transaction-list">
        <!-- Lançamentos renderizados via JavaScript -->
      </tbody>
    </table>
  </div>

  <script>
    // Base inicial com os dados do pente fino
    const initialTransactions = [
      { id: 1, date: "2026-10-07", description: "Carne Boa Mm", category: "Mercado", amount: 33.38, type: "expense" },
      { id: 2, date: "2026-10-07", description: "Oscar Frutas", category: "Mercado", amount: 13.26, type: "expense" },
      { id: 3, date: "2026-10-06", description: "Mw Veiculos Ltda", category: "Aulas", amount: 350.00, type: "income" },
      { id: 4, date: "2026-10-06", description: "Ana Clara Dos Reis", category: "Aulas", amount: 210.00, type: "income" },
      { id: 5, date: "2026-10-06", description: "Fabio Ancai", category: "Aulas", amount: 80.00, type: "income" },
      { id: 6, date: "2026-10-06", description: "Condor Sítio Cercado", category: "Mercado", amount: 36.35, type: "expense" },
      { id: 7, date: "2026-10-05", description: "Fabiana de Figueiredo", category: "Aulas", amount: 120.00, type: "income" },
      { id: 8, date: "2026-10-05", description: "Posto Tijucas", category: "Transporte", amount: 50.00, type: "expense" },
      { id: 9, date: "2026-10-04", description: "Cícero Paulino", category: "Aulas", amount: 350.00, type: "income" },
      { id: 10, date: "2026-10-03", description: "Kauan Santos", category: "Aulas", amount: 230.00, type: "income" },
      { id: 11, date: "2026-10-02", description: "Salete B Ferreira", category: "Aulas", amount: 230.00, type: "income" },
      { id: 12, date: "2026-10-02", description: "Elaine Cerqueira", category: "Aulas", amount: 118.00, type: "income" },
      { id: 13, date: "2026-10-02", description: "Meire Daiane", category: "Aulas", amount: 40.00, type: "income" }
    ];

    let transactions = JSON.parse(localStorage.getItem("nando_finances")) || initialTransactions;

    function renderApp() {
      const list = document.getElementById("transaction-list");
      list.innerHTML = "";

      let income = 0;
      let expense = 0;

      transactions.forEach((item, index) => {
        if (item.type === "income") income += item.amount;
        else expense += item.amount;

        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${item.date.split('-').reverse().join('/')}</td>
          <td>${item.description}</td>
          <td>${item.category}</td>
          <td class="${item.type === 'income' ? 'green' : 'red'}">R$ ${item.amount.toFixed(2)}</td>
          <td><button class="btn-del" onclick="deleteTransaction(${index})">❌ Excluir</button></td>
        `;
        list.appendChild(row);
      });

      document.getElementById("total-receita").innerText = `R$ ${income.toFixed(2)}`;
      document.getElementById("total-despesas").innerText = `R$ ${expense.toFixed(2)}`;
      
      const saldo = income - expense;
      const saldoEl = document.getElementById("saldo-total");
      saldoEl.innerText = `${saldo >= 0 ? '+' : ''} R$ ${saldo.toFixed(2)}`;
      saldoEl.className = `value ${saldo >= 0 ? 'green' : 'red'}`;

      localStorage.setItem("nando_finances", JSON.stringify(transactions));
    }

    document.getElementById("finance-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const newTransaction = {
        id: Date.now(),
        date: document.getElementById("date").value,
        description: document.getElementById("description").value,
        amount: parseFloat(document.getElementById("amount").value),
        type: document.getElementById("type").value,
        category: document.getElementById("category").value
      };

      transactions.unshift(newTransaction);
      renderApp();
      e.target.reset();
    });

    function deleteTransaction(index) {
      transactions.splice(index, 1);
      renderApp();
    }

    // Set data de hoje no formulário
    document.getElementById("date").valueToDate = new Date();
    document.getElementById("date").value = new Date().toISOString().split('T')[0];

    renderApp();
  </script>
</body>
</html>
