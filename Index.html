<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobills App Nando - Dashboard & Transações</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
    body { background-color: #1a1a1e; color: #e1e1e6; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }

    /* Top Nav */
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .tabs-nav { display: flex; gap: 10px; }
    .tab-btn { background: #26262e; border: 1px solid #323238; color: #a8a8b3; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 14px; }
    .tab-btn.active-income { background: #00b37e; color: #fff; border-color: #00b37e; }
    .tab-btn.active-expense { background: #f75a68; color: #fff; border-color: #f75a68; }
    .tab-btn.active-all { background: #7c3aed; color: #fff; border-color: #7c3aed; }
    
    .btn-new { background: #00b37e; color: #fff; border: none; padding: 10px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    
    /* Cards Topo */
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .card { background: #222228; border-radius: 12px; padding: 18px; border: 1px solid #2d2d35; cursor: pointer; transition: transform 0.1s; }
    .card:hover { transform: translateY(-2px); border-color: #444450; }
    .card-title { font-size: 13px; color: #8d8d99; margin-bottom: 8px; }
    .card-value { font-size: 22px; font-weight: bold; }
    
    .green { color: #00b37e; }
    .red { color: #f75a68; }

    /* Seletor Mês/Ano Idêntico ao Mobills */
    .period-selector { text-align: center; margin: 25px 0 15px 0; }
    .year-nav { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 12px; }
    .year-btn { background: none; border: none; color: #00b37e; font-size: 18px; font-weight: bold; cursor: pointer; }
    .year-btn:hover { color: #fff; }
    .year-display { color: #00b37e; font-size: 16px; font-weight: bold; }

    .months-row { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; }
    .month-pill { background: transparent; border: 1px solid #323238; color: #00b37e; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; cursor: pointer; }
    .month-pill:hover { border-color: #00b37e; }
    .month-pill.active { background: #00b37e; color: #fff; border-color: #00b37e; font-weight: bold; }

    /* Lista de Transações */
    .table-container { background: #222228; border-radius: 12px; border: 1px solid #2d2d35; overflow: hidden; margin-bottom: 30px; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #2a2a32; color: #8d8d99; font-size: 12px; font-weight: 600; padding: 12px 16px; text-align: left; }
    td { padding: 14px 16px; border-bottom: 1px solid #2a2a32; font-size: 14px; color: #c4c4cc; }
    tr:hover { background: #26262e; }

    /* Pílula Diária Mobills */
    .day-summary-row { background: #1a1a1e; }
    .day-summary-td { padding: 8px 16px; text-align: center; }
    .day-pill { background: rgba(0, 179, 126, 0.15); color: #00b37e; padding: 4px 16px; border-radius: 15px; font-size: 12px; font-weight: bold; display: inline-block; }
    .day-pill.expense-pill { background: rgba(247, 90, 104, 0.15); color: #f75a68; }

    .status-check { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; }
    .status-paid { background: #00b37e; color: #fff; }
    .status-pending { background: #f75a68; color: #fff; font-weight: bold; }

    .cat-badge { display: inline-flex; align-items: center; gap: 6px; background: #2a2a32; padding: 4px 10px; border-radius: 12px; font-size: 12px; color: #fff; }
    .action-btn { background: none; border: none; color: #8d8d99; font-size: 18px; cursor: pointer; padding: 4px; }
    .action-btn:hover { color: #fff; }

    /* Modal Mobills */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal { background: #222228; border-radius: 16px; width: 100%; max-width: 400px; padding: 24px; border: 1px solid #323238; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: #8d8d99; margin-bottom: 4px; }
    .form-control { width: 100%; background: #1a1a1e; border: 1px solid #323238; border-radius: 8px; padding: 10px; color: #fff; font-size: 14px; outline: none; }
    .btn-save { width: 100%; padding: 12px; border-radius: 20px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; background: #00b37e; color: #fff; }
    .btn-delete { width: 100%; padding: 10px; border-radius: 20px; border: 1px solid #f75a68; background: transparent; color: #f75a68; font-weight: bold; cursor: pointer; margin-top: 8px; }
    .empty-msg { text-align: center; padding: 30px; color: #8d8d99; font-style: italic; }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <div class="tabs-nav">
        <button class="tab-btn active-all" id="btn-tab-all" onclick="setTab('all')">Todas</button>
        <button class="tab-btn" id="btn-tab-income" onclick="setTab('income')">✓ Receitas</button>
        <button class="tab-btn" id="btn-tab-expense" onclick="setTab('expense')">✕ Despesas</button>
      </div>
      <button class="btn-new" onclick="openModal()">+ Nova Transação</button>
    </div>

    <!-- Cards Superiores Interativos -->
    <div class="cards-grid" id="cards-container"></div>

    <!-- Seletor de Anos e Meses Mobills -->
    <div class="period-selector">
      <div class="year-nav">
        <button class="year-btn" onclick="changeYear(-1)">‹</button>
        <span class="year-display" id="year-display">2026</span>
        <button class="year-btn" onclick="changeYear(1)">›</button>
      </div>
      <div class="months-row" id="months-row"></div>
    </div>

    <!-- Tabela de Transações -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th style="width: 40px;">Situação</th>
            <th>Data</th>
            <th>Descrição</th>
            <th>Categoria</th>
            <th>Conta</th>
            <th style="text-align: right;">Valor</th>
            <th style="width: 40px; text-align: center;">Ações</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </div>

  <!-- Modal de Edição / Cadastro -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 style="color:#fff;" id="modal-title">Editar Transação</h3>
        <button style="background:none; border:none; color:#8d8d99; font-size:20px; cursor:pointer;" onclick="closeModal()">✕</button>
      </div>

      <input type="hidden" id="edit-id">

      <div class="form-group">
        <label>Valor (R$)</label>
        <input type="number" step="0.01" class="form-control" id="input-amount" style="font-size:20px; font-weight:bold;">
      </div>

      <div class="form-group">
        <label>Tipo</label>
        <select class="form-control" id="input-type">
          <option value="income">Receita (Entrada)</option>
          <option value="expense">Despesa (Saída)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Status</label>
        <select class="form-control" id="input-status">
          <option value="true">Pago / Recebido</option>
          <option value="false">Pendente</option>
        </select>
      </div>

      <div class="form-group">
        <label>Data</label>
        <input type="date" class="form-control" id="input-date">
      </div>

      <div class="form-group">
        <label>Descrição</label>
        <input type="text" class="form-control" id="input-description">
      </div>

      <div class="form-group">
        <label>Categoria</label>
        <select class="form-control" id="input-category">
          <option value="Mensalidade">Mensalidade</option>
          <option value="Salário">Salário</option>
          <option value="Prêmio">Prêmio</option>
          <option value="Mercado dia dia">Mercado dia dia</option>
          <option value="Manutenção da casa">Manutenção da casa</option>

          <option value="Lazer">Lazer</option>

          <option value="Outros">Outros</option>
        </select>
      </div>

      <button class="btn-save" onclick="saveTransaction()">SALVAR</button>
      <button class="btn-delete" id="btn-del-modal" onclick="deleteTransaction()">EXCLUIR TRANSAÇÃO</button>
    </div>
  </div>

        btn.innerText = m;
        btn.onclick = () => {
          selectedMonth = idx;
          renderMonthPills();
          renderApp();
        };
        container.appendChild(btn);
      });
      document.getElementById("year-display").innerText = selectedYear;
    }

    function changeYear(delta) {
      selectedYear += delta;
      renderMonthPills();
      renderApp();
    }

    function setTab(tab) {
      currentTab = tab;
      document.getElementById("btn-tab-all").className = `tab-btn ${tab === 'all' ? 'active-all' : ''}`;
      document.getElementById("btn-tab-income").className = `tab-btn ${tab === 'income' ? 'active-income' : ''}`;
      document.getElementById("btn-tab-expense").className = `tab-btn ${tab === 'expense' ? 'active-expense' : ''}`;
      renderApp();
    }

    function getFilteredByDate() {
      const monthFormatted = (selectedMonth + 1).toString().padStart(2, '0');
      const prefix = `${selectedYear}-${monthFormatted}`;
      return transactions.filter(t => t.date.startsWith(prefix));
    }

    function renderCards() {
      const cardsContainer = document.getElementById("cards-container");
      const dateFiltered = getFilteredByDate();
      
      let recPendente = 0, recPaga = 0;
      let despPendente = 0, despPaga = 0;

      dateFiltered.forEach(t => {
        if (t.type === "income") {
          if (t.status) recPaga += t.amount;
          else recPendente += t.amount;
        } else {
          if (t.status) despPaga += t.amount;
          else despPendente += t.amount;
        }
      });

      if (currentTab === "income") {
        cardsContainer.innerHTML = `
          <div class="card" onclick="setTab('income')">
            <div class="card-title">Receitas pendentes ›</div>
            <div class="card-value red">R$ ${recPendente.toFixed(2)}</div>
          </div>
          <div class="card" onclick="setTab('income')">
            <div class="card-title">Receitas recebidas ›</div>
            <div class="card-value green">R$ ${recPaga.toFixed(2)}</div>
          </div>
          <div class="card" onclick="setTab('income')">
            <div class="card-title">Total Receitas ›</div>
            <div class="card-value green">R$ ${(recPendente + recPaga).toFixed(2)}</div>
          </div>
        `;
      } else if (currentTab === "expense") {
        cardsContainer.innerHTML = `
          <div class="card" onclick="setTab('expense')">
            <div class="card-title">Despesas pendentes ›</div>
            <div class="card-value red">R$ ${despPendente.toFixed(2)}</div>
          </div>
          <div class="card" onclick="setTab('expense')">
            <div class="card-title">Despesas pagas ›</div>
            <div class="card-value green">R$ ${despPaga.toFixed(2)}</div>
          </div>
          <div class="card" onclick="setTab('expense')">
            <div class="card-title">Total Despesas ›</div>
            <div class="card-value red">R$ ${(despPendente + despPaga).toFixed(2)}</div>
          </div>
        `;
      } else {
        const saldoGeral = (recPaga - despPaga);
        cardsContainer.innerHTML = `
          <div class="card" onclick="setTab('income')">
            <div class="card-title">Receitas Recebidas ›</div>
            <div class="card-value green">R$ ${recPaga.toFixed(2)}</div>
          </div>
          <div class="card" onclick="setTab('expense')">
            <div class="card-title">Despesas Pagas ›</div>
            <div class="card-value red">R$ ${despPaga.toFixed(2)}</div>
          </div>
          <div class="card" onclick="setTab('all')">
            <div class="card-title">Saldo Atual (Caixa) ›</div>
            <div class="card-value ${saldoGeral >= 0 ? 'green' : 'red'}">R$ ${saldoGeral.toFixed(2)}</div>
          </div>
        `;
      }
    }

    function renderTable() {
      const tbody = document.getElementById("table-body");
      tbody.innerHTML = "";

      let filtered = getFilteredByDate();
      if (currentTab === "income") filtered = filtered.filter(t => t.type === "income");
      if (currentTab === "expense") filtered = filtered.filter(t => t.type === "expense");

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty-msg">Nenhuma transação encontrada para este mês.</td></tr>`;
        return;
      }

      const dates = [...new Set(filtered.map(t => t.date))].sort().reverse();

      dates.forEach(date => {
        const dayItems = filtered.filter(t => t.date === date);
        let dayTotal = 0;

        dayItems.forEach((item) => {
          dayTotal += item.amount;
          const indexInMain = transactions.findIndex(t => t.id === item.id);

          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>
              <div class="status-check ${item.status ? 'status-paid' : 'status-pending'}" onclick="toggleStatus(${indexInMain})">
                ${item.status ? '✓' : '!'}
              </div>
            </td>
            <td>${item.date.split('-').reverse().join('/')}</td>
            <td style="font-weight: 500; color: #fff;">${item.description}</td>
            <td><span class="cat-badge">${item.category}</span></td>
            <td>${item.account}</td>
            <td style="text-align: right; font-weight: bold;" class="${item.type === 'income' ? 'green' : 'red'}">
              R$ ${item.amount.toFixed(2)}
            </td>
            <td style="text-align: center;">
              <button class="action-btn" onclick="openModal(${indexInMain})">⋮</button>
            </td>
          `;
          tbody.appendChild(tr);
        });

        const firstType = dayItems[0].type;
        const summaryTr = document.createElement("tr");
        summaryTr.className = "day-summary-row";
        summaryTr.innerHTML = `
          <td colspan="7" class="day-summary-td">
            <span class="day-pill ${firstType === 'expense' ? 'expense-pill' : ''}">
              Neste dia você ${firstType === 'income' ? 'recebeu' : 'gastou'} R$ ${dayTotal.toFixed(2)}
            </span>
          </td>
        `;
        tbody.appendChild(summaryTr);
      });

      localStorage.setItem("mobills_nando_v2026", JSON.stringify(transactions));
    }

    function toggleStatus(index) {
      transactions[index].status = !transactions[index].status;
      renderApp();
    }

    function renderApp() {
      renderCards();
      renderTable();
    }

    function openModal(index = null) {
      document.getElementById("modal-overlay").style.display = "flex";
      
      if (index !== null) {
        const item = transactions[index];
        document.getElementById("modal-title").innerText = "Editar Transação";
        document.getElementById("edit-id").value = index;
        document.getElementById("input-amount").value = item.amount;
        document.getElementById("input-type").value = item.type;
        document.getElementById("input-status").value = item.status.toString();
        document.getElementById("input-date").value = item.date;
        document.getElementById("input-description").value = item.description;
        document.getElementById("input-category").value = item.category;
        document.getElementById("btn-del-modal").style.display = "block";
      } else {
        document.getElementById("modal-title").innerText = "Nova Transação";
        document.getElementById("edit-id").value = "";
        document.getElementById("input-amount").value = "";
        document.getElementById("input-type").value = "expense";
        document.getElementById("input-status").value = "true";
        
        const monthStr = (selectedMonth + 1).toString().padStart(2, '0');
        document.getElementById("input-date").value = `${selectedYear}-${monthStr}-01`;
        
        document.getElementById("input-description").value = "";
        document.getElementById("input-category").value = "Mercado dia dia";
        document.getElementById("btn-del-modal").style.display = "none";
      }
    }

    function closeModal() {
      document.getElementById("modal-overlay").style.display = "none";
    }

    function saveTransaction() {
      const index = document.getElementById("edit-id").value;
      const item = {
        id: index !== "" ? transactions[index].id : "new_" + Date.now(),
        amount: parseFloat(document.getElementById("input-amount").value) || 0,
        type: document.getElementById("input-type").value,
        status: document.getElementById("input-status").value === "true",
        date: document.getElementById("input-date").value,
        description: document.getElementById("input-description").value,
        category: document.getElementById("input-category").value,
        account: "Carteira"
      };

      if (index !== "") {
        transactions[index] = item;
      } else {
        transactions.unshift(item);
      }

      closeModal();
      renderApp();
    }

    function deleteTransaction() {
      const index = document.getElementById("edit-id").value;
      if (index !== "") {
        transactions.splice(index, 1);
        closeModal();
        renderApp();
      }
    }

    renderMonthPills();
    renderApp();
  </script>
</body>
</html>
